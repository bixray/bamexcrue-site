<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Bamex Crue</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #1e1e2f; background: #f7f8fb; }
    a { color: #0a66c2; }
    header, footer { padding: 1rem max(1.25rem, calc((100% - 1100px) / 2)); background: white; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; border-bottom: 1px solid #e8e8ee; }
    .brand { color: #0a66c2; font-size: 1.4rem; font-weight: 800; text-decoration: none; }
    nav { display: flex; gap: 1rem; flex-wrap: wrap; }
    main { width: min(1100px, calc(100% - 2rem)); margin: 2rem auto; }
    .panel { padding: 1.5rem; border: 1px solid #e4e6ed; border-radius: 16px; background: white; box-shadow: 0 8px 25px rgba(20, 30, 60, .05); }
    .narrow { max-width: 440px; margin: 4rem auto; }
    label { display: block; margin: .75rem 0 .35rem; font-weight: 650; }
    input, select, button { font: inherit; }
    input[type="password"], select { width: 100%; padding: .7rem; border: 1px solid #c9cbd4; border-radius: 8px; }
    button { padding: .65rem 1rem; border: 0; border-radius: 8px; background: #0a66c2; color: white; font-weight: 650; cursor: pointer; }
    button.secondary { background: #4a4a6a; }
    button.danger { background: #a32121; }
    .flash { margin: .75rem 0; padding: .75rem; border-radius: 8px; background: #eef4fc; }
    .flash.error { color: #8d1717; background: #fff0f0; }
    .flash.success { color: #176b3a; background: #effaf2; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .inquiry { margin-top: 1rem; padding: 1.25rem; border: 1px solid #e4e6ed; border-radius: 12px; background: white; }
    .inquiry header { padding: 0; border: 0; background: transparent; }
    .muted { color: #5f5f7a; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .actions { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
    .actions label { min-width: 160px; }
    .policy h2 { margin-top: 1.8rem; }
    @media (max-width: 600px) {
      header { align-items: flex-start; flex-direction: column; }
      .inquiry header { flex-direction: column; }
      .actions { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Bamex<span style="color:#1e1e2f">Crue</span></a>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="mailto:kizyben47@gmail.com">Contact</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p class="muted">BAMEX-CRUE · Uganda · <a href="mailto:kizyben47@gmail.com">kizyben47@gmail.com</a></p>
  </footer>
</body>
</html>
