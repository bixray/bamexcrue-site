services:
  - type: web
    name: bamexcrue
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    disk:
      name: bamexcrue-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - bamexcrue.com
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: BAMEX_DATABASE
        value: /var/data/bamexcrue.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
